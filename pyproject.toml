[project]
name = "netclip"
version = "0.1.0"
description = "NetClip - LAN-Zwischenablage"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = [".worktrees"]

[tool.ruff.lint]
# EXE002 deaktiviert: Repo liegt auf CIFS-Mount (file_mode=0755) — alle Dateien
# erscheinen dort als ausführbar; chmod wirkungslos. Keine echten Skripte im Projekt.
ignore = ["EXE002"]
